<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 工具导航 · 分类整合</title>
<style>
  :root{
    --bg:#0b0d12; --card:#151821; --line:#232838; --text:#e6e9ef;
    --muted:#8b93a5; --accent:#5b8cff; --free:#34d399; --paid:#fbbf24;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; padding:40px 16px 64px;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 15% 0%,#161c2e,#0b0d12 55%);
    color:var(--text);
  }
  .wrap{max-width:1100px;margin:0 auto;}
  header{margin-bottom:28px;}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:.5px;}
  .sub{color:var(--muted);font-size:14px;}

  /* ---- 筛选栏 ---- */
  .filters{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    padding:14px 16px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; margin-bottom:26px;
  }
  .filters .label{font-size:13px;color:var(--muted);margin-right:2px;}
  .chip{
    border:1px solid var(--line); background:transparent; color:var(--muted);
    padding:7px 15px; border-radius:999px; font-size:13px; cursor:pointer;
    transition:all .18s;
  }
  .chip:hover{color:var(--text);border-color:#3a4258;}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .divider{width:1px;height:22px;background:var(--line);margin:0 6px;}

  /* ---- 工具卡片网格 ---- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:14px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px; display:flex; flex-direction:column; gap:8px;
    text-decoration:none; color:var(--text);
    transition:transform .16s, border-color .16s, box-shadow .16s;
    animation:in .2s ease;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px);}}
  .card:hover{
    transform:translateY(-3px); border-color:#3a4258;
    box-shadow:0 14px 30px rgba(0,0,0,.35);
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-name{font-size:15px;font-weight:600;line-height:1.3;}
  .card-url{font-size:11px;color:var(--muted);word-break:break-all;line-height:1.4;}
  .card-desc{font-size:12.5px;color:var(--muted);line-height:1.55;flex:1;}
  .card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .tag{
    font-size:11px;padding:3px 9px;border-radius:999px;
    background:#1d2230;color:#9aa3b8;border:1px solid #2a3145;
  }
  .tag.free{color:var(--free);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08);}
  .tag.paid{color:var(--paid);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08);}
  .tag.both{color:#a78bfa;border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.08);}
  .empty{
    grid-column:1/-1;text-align:center;color:var(--muted);
    padding:60px 0;font-size:14px;
  }
  .count{margin:18px 0 0;font-size:12.5px;color:var(--muted);text-align:right;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 工具导航</h1>
    <div class="sub">按「使用类型」与「付费模式」筛选，点击卡片直达官网</div>
  </header>

  <!-- 筛选栏 -->
  <div class="filters" id="filters">
    <span class="label">类型</span>
    <button class="chip active" data-type="all">全部</button>
    <button class="chip" data-type="chat">💬 对话</button>
    <button class="chip" data-type="image">🖼️ 图片</button>
    <button class="chip" data-type="video">🎬 视频</button>
    <button class="chip" data-type="write">✍️ 写作</button>
    <button class="chip" data-type="music">🎵 音乐</button>
    <button class="chip" data-type="code">💻 编程</button>
    <button class="chip" data-type="design">🎨 设计</button>
    <button class="chip" data-type="efficiency">⚡ 效率</button>

    <span class="divider"></span>

    <span class="label">费用</span>
    <button class="chip active" data-price="all">全部</button>
    <button class="chip" data-price="free">🟢 免费</button>
    <button class="chip" data-price="paid">🟡 付费</button>
    <button class="chip" data-price="both">🟣 免费+付费</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="count" id="count"></div>
</div>

/* ============================================================
   渲染逻辑
   ============================================================ */
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
let activeType = 'all';
let activePrice = 'all';

const TYPE_LABEL = {
  chat:'对话', image:'图片', video:'视频', write:'写作',
  music:'音乐', code:'编程', design:'设计', efficiency:'效率'
};

const PRICE_LABEL = { free:'免费', paid:'付费', both:'免费+付费' };
const PRICE_CLASS = { free:'free', paid:'paid', both:'both' };

function render(){
  const list = TOOLS.filter(t =>
    (activeType === 'all' || t.type === activeType) &&
    (activePrice === 'all' || t.price === activePrice)
  );

  grid.innerHTML = list.length ? list.map(t => `
    <a class="card" href="${t.url}" target="_blank" rel="noopener">
      <div class="card-top">
        <span class="card-name">${t.name}</span>
      </div>
      <span class="card-url">${t.url.replace(/^https?:\/\//,'').replace(/\/$/,'')}</span>
      <span class="card-desc">${t.desc}</span>
      <div class="card-tags">
        <span class="tag">${TYPE_LABEL[t.type] || t.type}</span>
        <span class="tag ${PRICE_CLASS[t.price]}">${PRICE_LABEL[t.price]}</span>
      </div>
    </a>
  `).join('') : '<div class="empty">没有符合当前筛选条件的工具</div>';

  countEl.textContent = `共 ${list.length} 个工具`;
}

/* ---- 类型筛选 ---- */
document.querySelectorAll('#filters [data-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    activeType = btn.dataset.type;
    document.querySelectorAll('#filters [data-type]').forEach(b =>
      b.classList.toggle('active', b === btn)
    );
    render();
  });
});

/* ---- 费用筛选 ---- */
document.querySelectorAll('#filters [data-price]').forEach(btn => {
  btn.addEventListener('click', () => {
    activePrice = btn.dataset.price;
    document.querySelectorAll('#filters [data-price]').forEach(b =>
      b.classList.toggle('active', b === btn)
    );
    render();
  });
});

render();
</script>
</body>
</html>

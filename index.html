<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 工具导航 · 分类整合</title>
<style>
  :root{
    --bg:#0b0d12; --card:#151821; --line:#232838; --text:#e6e9ef;
    --muted:#8b93a5; --accent:#5b8cff; --free:#34d399; --paid:#fbbf24; --both:#a78bfa;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; padding:40px 16px 64px;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 15% 0%,#161c2e,#0b0d12 55%);
    color:var(--text);
  }
  .wrap{max-width:1280px;margin:0 auto;}
  header{margin-bottom:28px;}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:.5px;}
  .sub{color:var(--muted);font-size:14px;}

  /* ---- 布局 ---- */
  .app-layout{display:flex;gap:24px;}
  /* ---- 侧边栏 ---- */
  .sidebar{width:190px;flex-shrink:0;}
  .sidebar-header{font-size:12px;color:var(--muted);padding:8px 16px;text-transform:uppercase;letter-spacing:1px;}
  .category-nav{display:flex;flex-direction:column;gap:2px;}
  .cat-item{
    text-align:left;padding:9px 14px;border-radius:8px;background:transparent;
    color:var(--muted);border:none;cursor:pointer;font-size:13.5px;transition:all .2s;
  }
  .cat-item:hover{background:rgba(255,255,255,.05);color:var(--text);}
  .cat-item.active{background:var(--accent);color:#fff;}

  /* ---- 主内容区 ---- */
  .main-content{flex:1;min-width:0;}
  .main-header{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  #searchInput{
    flex:1;min-width:200px;padding:12px 16px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);color:var(--text);
    font-size:14px;outline:none;
  }
  #searchInput:focus{border-color:var(--accent);}
  .price-filters{display:flex;gap:6px;flex-wrap:wrap;}
  .price-chip{
    padding:8px 14px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--muted);cursor:pointer;font-size:13px;transition:all .2s;
  }
  .price-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* ---- 工具卡片 ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px;display:flex;flex-direction:column;gap:8px;
    text-decoration:none;color:var(--text);transition:transform .16s,border-color .16s,box-shadow .16s;
    animation:in .2s ease;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px);}}
  .card:hover{transform:translateY(-3px);border-color:#3a4258;box-shadow:0 14px 30px rgba(0,0,0,.35);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-name{font-size:15px;font-weight:600;line-height:1.3;}
  .card-url{font-size:11px;color:var(--muted);word-break:break-all;line-height:1.4;}
  .card-desc{font-size:12.5px;color:var(--muted);line-height:1.55;flex:1;}
  .card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .tag{font-size:11px;padding:3px 9px;border-radius:999px;background:#1d2230;color:#9aa3b8;border:1px solid #2a3145;}
  .tag.free{color:var(--free);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08);}
  .tag.paid{color:var(--paid);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08);}
  .tag.both{color:var(--both);border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.08);}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;font-size:14px;}
  .count{margin:18px 0 0;font-size:12.5px;color:var(--muted);text-align:right;}

  /* ---- 移动端适配 ---- */
  @media (max-width:768px){
    body{padding:24px 12px 48px;}
    .app-layout{flex-direction:column;gap:16px;}
    .sidebar{width:100%;}
    .category-nav{
      flex-direction:row;overflow-x:auto;white-space:nowrap;
      padding-bottom:6px;gap:4px;
    }
    .cat-item{flex-shrink:0;padding:8px 14px;font-size:13px;}
    .main-header{flex-direction:column;}
    .price-filters{overflow-x:auto;white-space:nowrap;padding-bottom:4px;}
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>

        <button class="cat-item" data-type="agent">🤖 智能体</button>
      </nav>
    </aside>

    <main class="main-content">

        <input type="text" id="searchInput" placeholder="搜索 AI 工具..." />
        <div class="price-filters" id="priceFilters">

        </div>
      </div>

      <div class="grid" id="grid"></div>
      <div class="count" id="count"></div>
    </main>
  </div>
</div>

/* ============================================================
   渲染逻辑
   ============================================================ */
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const searchInput = document.getElementById('searchInput');
let activeType = 'all';
let activePrice = 'all';
let searchTerm = '';

const TYPE_LABEL = {
  chat:'对话', image:'图片', video:'视频', write:'写作',
  music:'音乐', code:'编程', design:'设计', efficiency:'效率',
  search:'搜索', audio:'音频', agent:'智能体'
};

const PRICE_LABEL = { free:'免费', paid:'付费', both:'免费+付费' };
const PRICE_CLASS = { free:'free', paid:'paid', both:'both' };

function render(){
  const list = TOOLS.filter(t => {
    const matchType = activeType === 'all' || t.type === activeType;
    const matchPrice = activePrice === 'all' || t.price === activePrice;
    const matchSearch = !searchTerm ||
      t.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
      t.desc.toLowerCase().includes(searchTerm.toLowerCase());
    return matchType && matchPrice && matchSearch;
  });

  grid.innerHTML = list.length ? list.map(t => `
    <a class="card" href="${t.url}" target="_blank" rel="noopener">
      <div class="card-top">
        <span class="card-name">${t.name}</span>
      </div>
      <span class="card-url">${t.url.replace(/^https?:\/\//,'').replace(/\/$/,'')}</span>
      <span class="card-desc">${t.desc}</span>
      <div class="card-tags">
        <span class="tag">${TYPE_LABEL[t.type] || t.type}</span>
        <span class="tag ${PRICE_CLASS[t.price]}">${PRICE_LABEL[t.price]}</span>
      </div>
    </a>
  `).join('') : '<div class="empty">没有符合当前筛选条件的工具</div>';

  countEl.textContent = `共 ${list.length} 个工具`;
}

/* ---- 侧边栏分类筛选 ---- */
document.querySelectorAll('#categoryNav .cat-item').forEach(btn => {
  btn.addEventListener('click', () => {
    activeType = btn.dataset.type;
    document.querySelectorAll('#categoryNav .cat-item').forEach(b =>
      b.classList.toggle('active', b === btn)
    );
    render();
  });
});

/* ---- 费用筛选 ---- */
document.querySelectorAll('#priceFilters .price-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    activePrice = btn.dataset.price;
    document.querySelectorAll('#priceFilters .price-chip').forEach(b =>
      b.classList.toggle('active', b === btn)
    );
    render();
  });
});

/* ---- 实时搜索 ---- */
searchInput.addEventListener('input', (e) => {
  searchTerm = e.target.value.trim();
  render();
});

render();
</script>
